name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # Type checking and unit tests with coverage
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests with coverage
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        if: matrix.node-version == 20
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage/lcov.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Integration tests with isolated git repos
  integration:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Setup Git for tests
        run: |
          git config --global user.email "test@devflow.test"
          git config --global user.name "Test User"

      - name: Integration tests
        run: npm run test:integration

  # Validate demo tape files and check coverage
  validate-demos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Install VHS
        run: |
          # Install via Charm apt repo — this pulls in ttyd + ffmpeg automatically
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL https://repo.charm.sh/apt/gpg.key | sudo gpg --dearmor -o /etc/apt/keyrings/charm.gpg
          echo "deb [signed-by=/etc/apt/keyrings/charm.gpg] https://repo.charm.sh/apt/ * *" | sudo tee /etc/apt/sources.list.d/charm.list
          sudo apt-get update && sudo apt-get install -y vhs
          vhs --version

      - name: Validate tape files
        run: npm run demo:validate
        env:
          DEVFLOW_BIN: ${{ github.workspace }}/dist/index.js

      - name: Check demo coverage
        run: npm run demo:coverage
